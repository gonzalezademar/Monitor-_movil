name: 🤖 Generar APK Android

on:
  push:
    branches:
      - main
  # También permite ejecutarlo manualmente desde la pestaña "Actions" de GitHub
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK de Radar Familiar
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código fuente
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar Node.js 20
      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias del proyecto
      - name: 📦 Instalar dependencias
        run: npm install

      # 4. Compilar la app web (sin base URL de GitHub Pages, usa ./)
      - name: 🔨 Compilar aplicación web para Capacitor
        run: npm run build

      # 5. Configurar Java 17 (requerido por el SDK de Android)
      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 6. Configurar el SDK de Android
      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      # 7. Inicializar el proyecto Android de Capacitor
      #    (genera la carpeta android/ con todo el proyecto nativo)
      - name: 🏗️ Inicializar proyecto Android (Capacitor)
        run: npx cap add android

      # 8. Sincronizar el build web dentro del proyecto Android
      - name: 🔄 Sincronizar web con Capacitor
        run: npx cap sync android

      # 9. Dar permisos de ejecución al wrapper de Gradle
      - name: 🔑 Permisos de Gradle
        run: chmod +x android/gradlew

      # 10. Compilar el APK de debug (listo para instalar y probar)
      - name: 📱 Compilar APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # 11. Subir el APK como artefacto descargable en GitHub
      - name: ⬆️ Subir APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: RadarFamiliar-v${{ github.run_number }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
