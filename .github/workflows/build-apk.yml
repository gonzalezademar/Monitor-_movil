name: 🤖 Generar APK Android

on:
  push:
    branches:
      - main
  # También permite ejecutarlo manualmente desde la pestaña "Actions" de GitHub
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK de Radar Familiar
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código fuente
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar Node.js 20
      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Instalar dependencias del proyecto
      - name: 📦 Instalar dependencias
        run: npm install

      # 4. Compilar la app web (sin base URL de GitHub Pages, usa ./)
      - name: 🔨 Compilar aplicación web para Capacitor
        run: npm run build

      # 5. Configurar Java 17 (requerido por Gradle/Android)
      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 6. ubuntu-latest ya tiene Android SDK. Solo verificamos y apuntamos la ruta.
      - name: 🤖 Verificar Android SDK pre-instalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" || echo "build-tools no encontrado"
          ls "$ANDROID_HOME/platforms" || echo "platforms no encontrado"

      # 7. Inicializar el proyecto Android de Capacitor
      - name: 🏗️ Inicializar proyecto Android (Capacitor)
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
          ./node_modules/.bin/cap add android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      # 7.1. Inyectar permisos de Cámara y Audio en el AndroidManifest.xml generado
      - name: 🔐 Configurar Permisos de Android (Cámara y WebRTC)
        run: |
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>|g' android/app/src/main/AndroidManifest.xml

      # 8. Generar íconos Android personalizados desde resources/icon.png
      - name: 🎨 Generar íconos Android personalizados
        run: npx @capacitor/assets@latest generate --android
        continue-on-error: true  # Si falla, el build continúa con íconos predeterminados

      # 9. Sincronizar el build web dentro del proyecto Android
      - name: 🔄 Sincronizar web con Capacitor
        run: ./node_modules/.bin/cap sync android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      # 9. Dar permisos de ejecución al wrapper de Gradle
      - name: 🔑 Permisos de Gradle
        run: chmod +x android/gradlew

      # 10. Compilar el APK de debug (listo para instalar y probar)
      - name: 📱 Compilar APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      # 11. Subir el APK como artefacto descargable en GitHub
      - name: ⬆️ Subir APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: RadarFamiliar-v${{ github.run_number }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
